name: CI Validation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build playground and registry
        run: npm run build

      - name: Validate registry and showcase coverage
        run: npm run registry:validate

      - name: Run lint & hook tests
        run: npm run test:lint-hooks

      - name: Run CLI tests
        run: npm run test:cli

      - name: Check committed registry artifacts are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Registry artifacts or generated files are out of date:"
            git status --short
            exit 1
          fi
